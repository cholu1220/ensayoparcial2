services:
  python:
    image: python:3.12-slim
    container_name: contenedor_python_parcial
    working_dir: /app
    volumes:
      - ./python:/app
    ports:
      - "5007:5006"
    command: sh -c "pip install flask && python app.py"

  php:
    image: php:8.3-cli
    container_name: contenedor_php_parcial
    working_dir: /app
    volumes:
      - ./php:/app
    command: php suma.php

  mysql:
    image: mysql:8.0
    container_name: contenedor_mysql_parcial
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: parcial_db
      MYSQL_USER: usuario
      MYSQL_PASSWORD: secreto
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql


  laravel:
    image: php:8.4-cli
    container_name: contenedor_laravel_parcial
    working_dir: /var/www/html
    volumes:
      - ./laravel:/var/www/html
    ports:
      - "8000:8000"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: parcial_db
      DB_USERNAME: usuario
      DB_PASSWORD: secreto
    depends_on:
      - mysql
    command: >
      sh -c "apt-get update &&
      apt-get install -y --no-install-recommends git unzip &&
      docker-php-ext-install pdo_mysql &&
      curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer &&
      composer install --no-interaction &&
      php artisan migrate --force &&
      php artisan serve --host=0.0.0.0 --port=8000"

volumes:
  mysql_data:
services:
  python:
    image: python:3.12-slim
    container_name: contenedor_python_parcial
    working_dir: /app
    volumes:
      - ./python:/app
    ports:
      - "5007:5006"
    command: sh -c "pip install flask && python app.py"

  php:
    image: php:8.3-cli
    container_name: contenedor_php_parcial
    working_dir: /app
    volumes:
      - ./php:/app
    command: php suma.php

  mysql:
    image: mysql:8.0
    container_name: contenedor_mysql_parcial
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: parcial_db
      MYSQL_USER: usuario
      MYSQL_PASSWORD: secreto
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data: